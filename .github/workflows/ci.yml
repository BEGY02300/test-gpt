name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check js/app.js && node --check js/firebase-init.js
      - name: Ensure no Firebase config is committed
        run: test ! -f js/firebase-config.js
