<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Radio du Collège</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="hero card">
      <p class="badge">🎧 Web Radio du Collège</p>
      <h1 id="hook-title">Chargement…</h1>
      <p id="hook-subtitle">Préparation de l'accroche</p>
      <a id="hook-link" class="ghost-button" href="#playlists">Découvrir les podcasts</a>
    </header>

    <main>
      <section class="card" id="auth-card">
        <h2>Connexion Firebase</h2>
        <p id="auth-status" class="status">Non connecté</p>

        <div class="auth-buttons">
          <button id="btn-anon" type="button">Connexion anonyme</button>
          <button id="btn-google" type="button">Connexion Google</button>
        </div>

        <form id="email-form" class="form-grid">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Mot de passe" required minlength="6" />
          <div class="auth-buttons">
            <button type="submit">Se connecter</button>
            <button type="button" id="btn-register">Créer un compte</button>
            <button type="button" id="btn-logout" class="danger">Se déconnecter</button>
          </div>
        </form>
      </section>

      <section class="card" id="playlists">
        <div class="section-head">
          <h2>Playlists</h2>
          <p>Dossier GitHub: <code>/playlists</code></p>
        </div>
        <div id="playlist-list"></div>
      </section>

      <section class="card player-card">
        <h2>Lecteur</h2>
        <p id="current-track">Aucune piste sélectionnée</p>
        <audio id="audio-player" controls preload="none"></audio>
      </section>
    </main>

    <footer>
      <small>Projet Web Radio — prêt pour GitHub Pages</small>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
