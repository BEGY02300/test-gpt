<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Radio du Collège</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>🎙️ Web Radio du Collège</h1>
      <p>Écoutez nos podcasts et émissions</p>
    </header>

    <main>
      <section class="card">
        <h2>Connexion</h2>
        <p id="auth-status">Non connecté</p>

        <div class="auth-buttons">
          <button id="btn-anon">Connexion anonyme</button>
          <button id="btn-google">Connexion Google</button>
        </div>

        <form id="email-form">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Mot de passe" required minlength="6" />
          <div class="auth-buttons">
            <button type="submit" data-action="login">Se connecter</button>
            <button type="button" id="btn-register">Créer un compte</button>
            <button type="button" id="btn-logout">Se déconnecter</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Playlists</h2>
        <p>Les playlists sont gérées depuis le dossier <code>/playlists</code> de GitHub.</p>
        <div id="playlist-list"></div>
      </section>

      <section class="card">
        <h2>Lecteur</h2>
        <p id="current-track">Aucune piste sélectionnée</p>
        <audio id="audio-player" controls preload="none"></audio>
      </section>
    </main>

    <footer>
      <small>Projet Web Radio — hébergeable via GitHub Pages</small>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
